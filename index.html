<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>C Messenger</title>
    <meta name="theme-color" content="#0f0f11">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="C Messenger">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" href="icon-192.png">
    <style>
        :root {
            --bg-color: #0f0f11;
            --surface-color: #18181b;
            --surface-hover: #27272a;
            --border-color: #27272a;
            --text-primary: #f4f4f5;
            --text-secondary: #a1a1aa;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --danger: #ef4444;
            --bubble-me: #6366f1;
            --bubble-other: #27272a;
        }

        :root[data-theme="light"] {
            --bg-color: #f4f4f5;
            --surface-color: #ffffff;
            --surface-hover: #ececef;
            --border-color: #e4e4e7;
            --text-primary: #18181b;
            --text-secondary: #71717a;
            --bubble-other: #ececef;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            height: 100%;
            overscroll-behavior: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .app-shell {
            flex: 1;
            min-height: 0;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .screen {
            display: none;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }

        .screen.active { display: flex; }

        .screen.screen-center {
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .auth-card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .logo-c {
            font-size: 64px;
            font-weight: 900;
            color: var(--accent);
            margin-bottom: 8px;
            letter-spacing: -2px;
        }

        .auth-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 24px;
        }

        .input-group { margin-bottom: 16px; text-align: left; }

        .input-group label {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus { border-color: var(--accent); }

        .btn {
            padding: 12px 16px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s, transform 0.15s;
        }
        .btn:active { transform: scale(0.97); }
        .btn-secondary { background: transparent; border: 1px solid var(--border-color); color: var(--text-primary); }
        .btn-danger { background: var(--danger); }
        .btn-block { width: 100%; margin-top: 8px; }

        .switch-auth {
            margin-top: 16px;
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
        }
        .switch-auth span { color: var(--accent); font-weight: 500; }

        .error-msg { color: var(--danger); font-size: 12px; margin-top: 12px; display: none; }

        .top-bar {
            padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 14px;
            background: color-mix(in srgb, var(--surface-color) 92%, transparent);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .top-bar-title { font-size: 19px; font-weight: 700; flex: 1; }
        .top-bar-actions { display: flex; gap: 2px; }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-primary);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }
        .icon-btn:active { background: var(--surface-hover); }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--accent);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            flex-shrink: 0;
        }

        .chats-list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        .chat-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid var(--border-color);
        }
        .chat-item:active { background: var(--surface-hover); }
        .chat-item-info { flex: 1; min-width: 0; }
        .chat-item-name { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
        .chat-item-last {
            font-size: 13px; color: var(--text-secondary);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .chat-item-time { font-size: 11px; color: var(--text-secondary); flex-shrink: 0; }
        .chats-empty { padding: 60px 24px; text-align: center; color: var(--text-secondary); font-size: 14px; line-height: 1.5; }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6);
            display: flex; align-items: center; justify-content: center;
            z-index: 500; padding: 20px;
        }
        .modal-card {
            background: var(--surface-color); border: 1px solid var(--border-color);
            border-radius: 20px; padding: 22px; width: 100%; max-width: 360px;
        }
        .modal-title { font-size: 17px; font-weight: 700; margin-bottom: 16px; }
        .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
        .modal-actions .btn { flex: 1; }

        .messages-list {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 78%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.4;
            word-break: break-word;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.me {
            background: var(--bubble-me); color: white;
            align-self: flex-end; border-bottom-right-radius: 4px;
        }
        .message.other {
            background: var(--bubble-other); color: var(--text-primary);
            align-self: flex-start; border-bottom-left-radius: 4px;
            border: 1px solid var(--border-color);
        }
        .msg-time { font-size: 10px; text-align: right; margin-top: 4px; opacity: 0.7; }
        .message img { max-width: 100%; border-radius: 8px; margin-top: 4px; display: block; }
        .message audio { max-width: 100%; margin-top: 4px; height: 35px; }

        .typing-indicator-box {
            padding: 0 16px 6px; font-size: 12px; color: var(--text-secondary);
            height: 18px; font-style: italic; flex-shrink: 0;
        }

        .chat-input-panel {
            padding: 10px 12px calc(12px + env(safe-area-inset-bottom, 0px));
            background: color-mix(in srgb, var(--surface-color) 92%, transparent);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-top: 1px solid var(--border-color);
            display: flex; flex-direction: column; gap: 8px; flex-shrink: 0;
        }
        .input-row { display: flex; align-items: center; gap: 10px; }

        .attachment-preview {
            display: flex; align-items: center; gap: 10px;
            background: var(--bg-color); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 8px 10px;
        }
        .attachment-thumb img { width: 44px; height: 44px; object-fit: cover; border-radius: 8px; display: block; }
        .attachment-thumb .audio-icon {
            width: 44px; height: 44px; border-radius: 8px; background: var(--accent);
            color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .attachment-info { flex: 1; font-size: 13px; color: var(--text-secondary); display: flex; align-items: center; gap: 8px; min-width: 0; }
        .attachment-info span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .attachment-info audio { height: 28px; max-width: 160px; }
        .remove-attachment { background: transparent; border: none; color: var(--text-secondary); cursor: pointer; font-size: 16px; padding: 4px 8px; flex-shrink: 0; }
        .remove-attachment:hover { color: var(--danger); }

        .file-btn {
            background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-secondary);
            width: 44px; height: 44px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: all 0.15s; flex-shrink: 0;
        }
        .file-btn:active { transform: scale(0.9); }
        .chat-input-panel input[type="text"] { flex: 1; border-radius: 20px; padding: 11px 16px; font-size: 16px; }

        .send-btn {
            background: var(--accent); color: white; border: none;
            width: 44px; height: 44px; border-radius: 50%; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            transition: background 0.15s, transform 0.15s; flex-shrink: 0;
        }
        .send-btn:active { transform: scale(0.9); }
        .send-btn:disabled { opacity: 0.5; }

        .mic-btn.recording { background: var(--danger); border-color: var(--danger); color: #fff; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        #file-input { display: none; }

        .settings-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 20px; }
        .settings-section { margin-bottom: 24px; }
        .settings-section > .settings-label {
            display: block; font-size: 12px; color: var(--text-secondary);
            text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px;
        }
        .settings-row { display: flex; gap: 8px; }
        .settings-row input { flex: 1; }
        .settings-static {
            font-size: 14px; color: var(--text-primary); padding: 12px 16px;
            background: var(--surface-color); border-radius: 12px; border: 1px solid var(--border-color);
        }
        .settings-toggle-row {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--surface-color); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 12px 16px;
        }
        .settings-toggle-row .settings-toggle-label { font-size: 14px; color: var(--text-primary); }
        .settings-toggle-hint { font-size: 11px; color: var(--text-secondary); margin-top: 4px; }

        .switch { position: relative; display: inline-block; width: 46px; height: 26px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .switch .slider {
            position: absolute; cursor: pointer; inset: 0; background: var(--border-color);
            transition: 0.2s; border-radius: 26px;
        }
        .switch .slider:before {
            content: ""; position: absolute; height: 20px; width: 20px; left: 3px; bottom: 3px;
            background: #fff; transition: 0.2s; border-radius: 50%;
        }
        .switch input:checked + .slider { background: var(--accent); }
        .switch input:checked + .slider:before { transform: translateX(20px); }

        .file-protocol-banner {
            position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
            background: #b91c1c; color: white; padding: 10px 14px;
            text-align: center; font-size: 12px;
        }

        .toast {
            position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
            padding: 10px 16px; border-radius: 12px; background: var(--surface-color);
            color: var(--text-primary); border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px rgba(0,0,0,.35); opacity: 0; pointer-events: none;
            transition: opacity .2s, transform .2s; z-index: 2000; font-size: 13px; max-width: 90%;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast-error { border-color: var(--danger); }

        .hidden { display: none !important; }

        .image-viewer {
            position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,.9);
            display: flex; align-items: center; justify-content: center; padding: 20px; cursor: zoom-out;
        }
        .image-viewer img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }

        @media (max-width: 520px) {
            .auth-card { padding: 28px 22px; }
            .message { max-width: 88%; }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <div id="auth-screen" class="screen screen-center active">
            <div class="auth-card">
                <div class="logo-c">C</div>
                <h1 id="auth-title" class="auth-title">Вход в C Messenger</h1>
                <div class="input-group">
                    <label for="email-input">Email</label>
                    <input id="email-input" type="email" autocomplete="email" placeholder="you@example.com">
                </div>
                <div class="input-group">
                    <label for="password-input">Пароль</label>
                    <input id="password-input" type="password" autocomplete="current-password" placeholder="Минимум 6 символов">
                </div>
                <div id="nickname-group" class="input-group hidden">
                    <label for="nickname-input">Имя</label>
                    <input id="nickname-input" type="text" autocomplete="name" placeholder="Ваше имя">
                </div>
                <button id="auth-btn" class="btn btn-block">Войти</button>
                <div id="switch-auth" class="switch-auth">Нет аккаунта? <span>Зарегистрироваться</span></div>
                <div id="auth-error" class="error-msg"></div>
            </div>
        </div>

        <div id="chats-screen" class="screen">
            <div class="top-bar">
                <div class="top-bar-title">Чаты</div>
                <div class="top-bar-actions">
                    <button id="new-chat-btn" class="icon-btn" title="Новый чат">➕</button>
                    <button id="settings-btn" class="icon-btn" title="Настройки">⚙️</button>
                </div>
            </div>
            <div id="chats-list" class="chats-list"></div>
        </div>

        <div id="chat-screen" class="screen">
            <div class="top-bar">
                <button id="back-to-chats" class="icon-btn" title="Назад">←</button>
                <div id="chat-avatar" class="avatar">C</div>
                <div id="chat-title" class="top-bar-title">Чат</div>
            </div>
            <div id="messages-list" class="messages-list"></div>
            <div id="typing-indicator" class="typing-indicator-box"></div>
            <div class="chat-input-panel">
                <div id="attachment-preview" class="attachment-preview hidden">
                    <div id="attachment-thumb" class="attachment-thumb"></div>
                    <div id="attachment-info" class="attachment-info"></div>
                    <button id="remove-attachment" class="remove-attachment" title="Убрать">✕</button>
                </div>
                <div class="input-row">
                    <button id="file-btn" class="file-btn" title="Отправить фото">📎</button>
                    <input id="file-input" type="file" accept="image/*">
                    <input id="message-input" type="text" placeholder="Сообщение..." autocomplete="off">
                    <button id="mic-btn" class="file-btn mic-btn" title="Записать голос">🎤</button>
                    <button id="send-btn" class="send-btn" title="Отправить">➤</button>
                </div>
            </div>
        </div>

        <div id="settings-screen" class="screen">
            <div class="top-bar">
                <button id="back-from-settings" class="icon-btn" title="Назад">←</button>
                <div class="top-bar-title">Настройки</div>
            </div>
            <div class="settings-body">
                <div class="settings-section">
                    <label class="settings-label">Имя</label>
                    <div class="settings-row">
                        <input type="text" id="settings-name-input" placeholder="Ваше имя">
                        <button id="settings-name-save" class="btn">Сохранить</button>
                    </div>
                </div>
                <div class="settings-section">
                    <label class="settings-label">Email</label>
                    <div class="settings-static" id="settings-email"></div>
                </div>
                <div class="settings-section settings-toggle-row">
                    <div class="settings-toggle-label">Тёмная тема</div>
                    <label class="switch"><input type="checkbox" id="theme-toggle"><span class="slider"></span></label>
                </div>
                <div class="settings-section">
                    <div class="settings-toggle-row">
                        <div class="settings-toggle-label">Уведомления о сообщениях</div>
                        <label class="switch"><input type="checkbox" id="notif-toggle"><span class="slider"></span></label>
                    </div>
                    <div class="settings-toggle-hint">Работают, только пока эта вкладка открыта в браузере — это не push-уведомления.</div>
                </div>
                <button id="settings-logout-btn" class="btn btn-danger btn-block" style="margin-top: 12px;">Выйти из аккаунта</button>
            </div>
        </div>
    </div>

    <div id="image-viewer" class="image-viewer hidden">
        <img id="image-viewer-img" src="" alt="фото">
    </div>

    <script>
        function __showGlobalError(msg) {
            let el = document.getElementById('global-error-banner');
            if (!el) {
                el = document.createElement('div');
                el.id = 'global-error-banner';
                el.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#b91c1c;color:#fff;font-size:12px;line-height:1.4;padding:10px 14px;text-align:center;z-index:9999;';
                document.body.prepend(el);
            }
            el.textContent = msg;
        }
        window.addEventListener('error', function (e) {
            console.error('Глобальная ошибка:', e.error || e.message);
            __showGlobalError('⚠️ Ошибка загрузки страницы: ' + (e.message || 'см. консоль браузера (F12)'));
        });
        window.addEventListener('unhandledrejection', function (e) {
            console.error('Необработанная ошибка промиса:', e.reason);
            const text = (e.reason && e.reason.message) ? e.reason.message : String(e.reason);
            __showGlobalError('⚠️ Ошибка: ' + text);
        });
    </script>

    <script type="module">

        var SUPABASE_BUCKET = 'chat-media';

        var __supabaseClientPromise = null;
        function getSupabaseClient() {
            if (!__supabaseClientPromise) {
                __supabaseClientPromise = import('https://esm.sh/@supabase/supabase-js@2')
                    .then(({ createClient }) => createClient(SUPABASE_URL, SUPABASE_ANON_KEY));

        // ===== Supabase Storage (фото и голосовые) =====
        var SUPABASE_STORAGE_URL = SUPABASE_URL.replace('.supabase.co', '.storage.supabase.co');

        async function uploadToSupabase(fileOrBlob, filename, folder) {
            if (!SUPABASE_URL || !SUPABASE_ANON_KEY) throw new Error('Supabase не настроен');
            if (!currentUser?.uid) throw new Error('Нужно войти в аккаунт перед загрузкой файла');

            const safeName = String(filename || 'file').replace(/[^a-zA-Z0-9._-]/g, '_');
            const uniqueId = crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}_${Math.random().toString(36).slice(2)}`;
            const safeFolder = String(folder || 'files').replace(/[^a-zA-Z0-9._-]/g, '_');
            const path = `${safeFolder}/${currentUser.uid}/${Date.now()}_${uniqueId}_${safeName}`;

            try {
                const supabase = await getSupabaseClient();
                const { error } = await supabase.storage
                    .from(SUPABASE_BUCKET)
                    .upload(path, fileOrBlob, {
                        cacheControl: '3600',
                        contentType: fileOrBlob.type || 'application/octet-stream',
                        upsert: false
                    });

                if (error) {
                    console.error('Supabase upload error:', error);
                    throw new Error(error.message || 'Ошибка загрузки файла');
                }

                const { data } = supabase.storage
                    .from(SUPABASE_BUCKET)
                    .getPublicUrl(path);

                if (!data?.publicUrl) throw new Error('Supabase не вернул ссылку на файл');
                return data.publicUrl;
            } catch (error) {
                console.error('Supabase upload error:', error);
                throw new Error(error?.message || 'Не удалось загрузить файл в Supabase Storage');

            storageBucket: "artvas-722f6.firebasestorage.app",
            messagingSenderId: "395618635567",
            appId: "1:395618635567:web:0e11091c3d766d56ce5bda",
            measurementId: "G-02MBC79J6E"
        };

        try {
            const savedTheme = localStorage.getItem('theme-pref');
            if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
        } catch (e) {}

        function showToast(message, isError = true) {
            let toast = document.getElementById('toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'toast';
                document.body.appendChild(toast);
            }
            toast.textContent = message;
            toast.className = 'toast show' + (isError ? ' toast-error' : '');
            clearTimeout(toast._hideTimer);
            toast._hideTimer = setTimeout(() => toast.classList.remove('show'), 4500);
        }

        if (location.protocol === 'file:') {
            const banner = document.createElement('div');
            banner.className = 'file-protocol-banner';
            banner.textContent = '⚠️ Открыто как локальный файл — вход и отправка фото/аудио могут не работать. Разместите на хостинге (например, GitHub Pages или Firebase Hosting) и открывайте по https://…';
            document.body.prepend(banner);
        }

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const rtdb = getDatabase(app);

        setPersistence(auth, browserLocalPersistence).catch((error) => {
            console.error('Ошибка сохранения сессии:', error);
            showToast('Не удалось включить сохранение сессии: ' + error.message);
        });

        let isSignUp = false;
        let currentUser = null;
        let currentChatId = null;
        let currentChatOtherUid = null;
        let mediaRecorder = null;
        let audioChunks = [];
        let typingTimeout = null;
        let pendingImageFile = null;
        let pendingAudioBlob = null;
        let pendingAudioUrl = null;
        let chatsUnsub = null;
        let messagesUnsub = null;
        let typingUnsub = null;
        let presenceUnsub = null;
        let replyingTo = null;
        let allChatsCache = [];

        const authScreen = document.getElementById('auth-screen');
        const authTitle = document.getElementById('auth-title');
        const authBtn = document.getElementById('auth-btn');
        const switchAuth = document.getElementById('switch-auth');
        const nicknameGroup = document.getElementById('nickname-group');
        const nicknameInput = document.getElementById('nickname-input');
        const emailInput = document.getElementById('email-input');
        const passwordInput = document.getElementById('password-input');
        const authError = document.getElementById('auth-error');
        const chatsScreen = document.getElementById('chats-screen');
        const chatScreen = document.getElementById('chat-screen');
        const settingsScreen = document.getElementById('settings-screen');
        const chatsList = document.getElementById('chats-list');
        const messagesList = document.getElementById('messages-list');
        const chatTitle = document.getElementById('chat-title');
        const chatAvatar = document.getElementById('chat-avatar');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const fileBtn = document.getElementById('file-btn');
        const fileInput = document.getElementById('file-input');
        const micBtn = document.getElementById('mic-btn');
        const attachmentPreview = document.getElementById('attachment-preview');
        const attachmentThumb = document.getElementById('attachment-thumb');
        const attachmentInfo = document.getElementById('attachment-info');
        const removeAttachment = document.getElementById('remove-attachment');
        const typingIndicator = document.getElementById('typing-indicator');
        const imageViewer = document.getElementById('image-viewer');
        const imageViewerImg = document.getElementById('image-viewer-img');

        function showScreen(screen) {
            [authScreen, chatsScreen, chatScreen, settingsScreen].forEach(el => el.classList.remove('active'));
            screen.classList.add('active');
        }

        function setAuthError(message) {
            authError.textContent = message || '';
            authError.style.display = message ? 'block' : 'none';
        }

        function normalizeName(user) {
            return user?.displayName || user?.email?.split('@')[0] || 'Пользователь';
        }

        function getInitial(name) {
            return (name || 'C').trim().charAt(0).toUpperCase() || 'C';
        }

        function escapeHtml(str) {
            return String(str ?? '').replace(/[&<>'"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[ch]));
        }

        function formatTime(timestamp) {
            if (!timestamp) return '';
            const d = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            return d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        }

        function formatChatTime(timestamp) {
            if (!timestamp) return '';
            const d = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            const now = new Date();
            if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
            return d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
        }

        function clearAttachment() {
            pendingImageFile = null;
            pendingAudioBlob = null;
            if (pendingAudioUrl) URL.revokeObjectURL(pendingAudioUrl);
            pendingAudioUrl = null;
            attachmentPreview.classList.add('hidden');
            attachmentThumb.innerHTML = '';
            attachmentInfo.innerHTML = '';
            fileInput.value = '';
        }

        function renderAttachmentPreview() {
            if (pendingImageFile) {
                attachmentPreview.classList.remove('hidden');
                attachmentThumb.innerHTML = '';
                const img = document.createElement('img');
                img.src = URL.createObjectURL(pendingImageFile);
                img.alt = 'превью';
                attachmentThumb.appendChild(img);
                attachmentInfo.innerHTML = `<span>${escapeHtml(pendingImageFile.name || 'Фото')}</span>`;
            } else if (pendingAudioBlob) {
                attachmentPreview.classList.remove('hidden');
                attachmentThumb.innerHTML = '<div class="audio-icon">🎤</div>';
                attachmentInfo.innerHTML = '';
                const audio = document.createElement('audio');
                audio.controls = true;
                audio.src = pendingAudioUrl;
                attachmentInfo.appendChild(audio);
            } else {
                clearAttachment();
            }
        }

        function setPendingImage(file) {
            clearAttachment();
            pendingImageFile = file;
            renderAttachmentPreview();
        }

        function setPendingAudio(blob) {
            clearAttachment();
            pendingAudioBlob = blob;
            pendingAudioUrl = URL.createObjectURL(blob);
            renderAttachmentPreview();
        }

        async function sendMessage() {
            if (!currentUser || !currentChatId) return;
            const text = messageInput.value.trim();
            if (!text && !pendingImageFile && !pendingAudioBlob) return;
            sendBtn.disabled = true;
            try {
                let imageUrl = null;
                let audioUrl = null;
                if (pendingImageFile) {
                    imageUrl = await uploadToSupabase(pendingImageFile, pendingImageFile.name || 'image.jpg', 'images');
                }
                if (pendingAudioBlob) {
                    audioUrl = await uploadToSupabase(pendingAudioBlob, `voice-${Date.now()}.webm`, 'audio');
                }

                const payload = {
                    senderId: currentUser.uid,
                    receiverId: currentChatOtherUid,
                    text: text || '',
                    imageUrl,
                    audioUrl,
                    createdAt: serverTimestamp()
                };
                if (replyingTo?.id) {
                    payload.replyTo = replyingTo.id;
                }
                await addDoc(collection(db, 'messages'), payload);
                messageInput.value = '';
                clearAttachment();
                replyingTo = null;
                await updateChatSummary(currentChatId, text || (imageUrl ? '📷 Фото' : '🎤 Голосовое сообщение'));
            } catch (error) {
                console.error(error);
                showToast('Не удалось отправить: ' + (error.message || error));
            } finally {
                sendBtn.disabled = false;
            }
        }

        async function updateChatSummary(chatId, lastText) {
            try {
                await updateDoc(doc(db, 'chats', chatId), {
                    lastMessage: lastText,
                    lastMessageAt: serverTimestamp()
                });
            } catch (e) {
                console.warn('Не удалось обновить чат:', e);
            }
        }

        function subscribeMessages(chatId) {
            if (messagesUnsub) messagesUnsub();
            const q = query(collection(db, 'messages'), where('chatId', '==', chatId), orderBy('createdAt', 'asc'));
            messagesUnsub = onSnapshot(q, snapshot => {
                messagesList.innerHTML = '';
                snapshot.forEach(snap => {
                    const msg = snap.data();
                    renderMessage(snap.id, msg);
                });
                messagesList.scrollTop = messagesList.scrollHeight;
            }, error => {
                console.error('Messages listener error:', error);
                showToast('Не удалось загрузить сообщения: ' + error.message);
            });
        }

        function renderMessage(id, msg) {
            const div = document.createElement('div');
            div.className = 'message ' + (msg.senderId === currentUser?.uid ? 'me' : 'other');
            div.dataset.id = id;
            let html = '';
            if (msg.text) html += `<div>${escapeHtml(msg.text).replace(/\n/g, '<br>')}</div>`;
            if (msg.imageUrl) html += `<img src="${escapeHtml(msg.imageUrl)}" alt="фото" class="message-image">`;
            if (msg.audioUrl) html += `<audio controls src="${escapeHtml(msg.audioUrl)}"></audio>`;
            html += `<div class="msg-time">${formatTime(msg.createdAt)}</div>`;
            div.innerHTML = html;
            messagesList.appendChild(div);
        }

        async function createOrOpenChat(otherUid, otherName) {
            if (!currentUser || !otherUid || otherUid === currentUser.uid) return;
            const ids = [currentUser.uid, otherUid].sort();
            const chatId = ids.join('_');
            const chatRef = doc(db, 'chats', chatId);
            const existing = await getDoc(chatRef);
            if (!existing.exists()) {
                await setDoc(chatRef, {
                    members: ids,
                    memberNames: {
                        [currentUser.uid]: normalizeName(currentUser),
                        [otherUid]: otherName || 'Пользователь'
                    },
                    lastMessage: '',
                    lastMessageAt: serverTimestamp()
                });
            }
            openChat(chatId, otherUid, otherName || 'Пользователь');
        }

        async function openChat(chatId, otherUid, otherName) {
            currentChatId = chatId;
            currentChatOtherUid = otherUid;
            chatTitle.textContent = otherName || 'Чат';
            chatAvatar.textContent = getInitial(otherName);
            showScreen(chatScreen);
            subscribeMessages(chatId);
            subscribeTyping(chatId);
            await markChatRead(chatId);
        }

        async function markChatRead(chatId) {
            try {
                await updateDoc(doc(db, 'chats', chatId), { [`unread_${currentUser.uid}`]: 0 });
            } catch (e) {}
        }

        function subscribeChats() {
            if (chatsUnsub) chatsUnsub();
            const q = query(collection(db, 'chats'), where('members', 'array-contains', currentUser.uid));
            chatsUnsub = onSnapshot(q, snapshot => {
                allChatsCache = [];
                snapshot.forEach(snap => {
                    const data = snap.data();
                    allChatsCache.push({ id: snap.id, ...data });
                });
                allChatsCache.sort((a,b) => {
                    const at = a.lastMessageAt?.toMillis?.() || 0;
                    const bt = b.lastMessageAt?.toMillis?.() || 0;
                    return bt - at;
                });
                renderChats();
            }, error => {
                console.error('Chats listener error:', error);
                showToast('Не удалось загрузить чаты: ' + error.message);
            });
        }

        function renderChats() {
            chatsList.innerHTML = '';
            if (!allChatsCache.length) {
                chatsList.innerHTML = '<div class="chats-empty">Пока нет чатов.<br>Нажмите ➕, чтобы начать новый чат.</div>';
                return;
            }
            allChatsCache.forEach(chat => {
                const otherUid = chat.members.find(id => id !== currentUser.uid);
                const otherName = chat.memberNames?.[otherUid] || 'Пользователь';
                const item = document.createElement('div');
                item.className = 'chat-item';
                item.innerHTML = `
                    <div class="avatar">${escapeHtml(getInitial(otherName))}</div>
                    <div class="chat-item-info">
                        <div class="chat-item-name">${escapeHtml(otherName)}</div>
                        <div class="chat-item-last">${escapeHtml(chat.lastMessage || '')}</div>
                    </div>
                    <div class="chat-item-time">${formatChatTime(chat.lastMessageAt)}</div>
                `;
                item.addEventListener('click', () => openChat(chat.id, otherUid, otherName));
                chatsList.appendChild(item);
            });
        }

        function subscribeTyping(chatId) {
            if (typingUnsub) typingUnsub();
            const typingRef = rtdbRef(rtdb, `typing/${chatId}/${currentChatOtherUid}`);
            typingUnsub = onValue(typingRef, snap => {
                typingIndicator.textContent = snap.val() ? `${chatTitle.textContent} печатает…` : '';
            });
        }

        function setTyping(value) {
            if (!currentUser || !currentChatId || !currentChatOtherUid) return;
            const ref = rtdbRef(rtdb, `typing/${currentChatId}/${currentUser.uid}`);
            rtdbSet(ref, value).catch(() => {});
            if (typingTimeout) clearTimeout(typingTimeout);
            if (value) typingTimeout = setTimeout(() => rtdbSet(ref, false).catch(() => {}), 1200);
        }

        function setupPresence() {
            if (!currentUser) return;
            const statusRef = rtdbRef(rtdb, `presence/${currentUser.uid}`);
            const connectedRef = rtdbRef(rtdb, '.info/connected');
            if (presenceUnsub) presenceUnsub();
            presenceUnsub = onValue(connectedRef, snap => {
                if (!snap.val()) return;
                onDisconnect(statusRef).set({ state: 'offline', lastChanged: rtdbServerTimestamp() }).catch(() => {});
                rtdbSet(statusRef, { state: 'online', lastChanged: rtdbServerTimestamp() }).catch(() => {});
            });
        }

        async function loadUsersForNewChat() {
            if (!currentUser) return;
            try {
                const snapshot = await getDocs(collection(db, 'users'));
                const users = [];
                snapshot.forEach(snap => {
                    if (snap.id !== currentUser.uid) users.push({ uid: snap.id, ...snap.data() });
                });
                users.sort((a,b) => String(a.displayName || a.email || '').localeCompare(String(b.displayName || b.email || ''), 'ru'));
                if (!users.length) {
                    showToast('Других пользователей пока нет', false);
                    return;
                }
                const names = users.map((u, i) => `${i+1}. ${u.displayName || u.email || 'Пользователь'}`).join('\n');
                const choice = prompt('Выберите пользователя:\n\n' + names + '\n\nВведите номер:');
                const index = Number(choice) - 1;
                if (!Number.isInteger(index) || !users[index]) return;
                const user = users[index];
                await createOrOpenChat(user.uid, user.displayName || user.email || 'Пользователь');
            } catch (e) {
                console.error(e);
                showToast('Не удалось получить список пользователей: ' + e.message);
            }
        }

        authBtn.addEventListener('click', async () => {
            setAuthError('');
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            if (!email || !password) {
                setAuthError('Введите email и пароль.');
                return;
            }
            authBtn.disabled = true;
            try {
                if (isSignUp) {
                    const nickname = nicknameInput.value.trim();
                    if (!nickname) throw new Error('Введите имя.');
                    const cred = await createUserWithEmailAndPassword(auth, email, password);
                    await updateProfile(cred.user, { displayName: nickname });
                    await setDoc(doc(db, 'users', cred.user.uid), {
                        displayName: nickname,
                        email,
                        createdAt: serverTimestamp()
                    });
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                }
            } catch (error) {
                console.error(error);
                const messages = {
                    'auth/invalid-credential': 'Неверный email или пароль.',
                    'auth/email-already-in-use': 'Этот email уже зарегистрирован.',
                    'auth/weak-password': 'Пароль должен содержать минимум 6 символов.',
                    'auth/invalid-email': 'Введите корректный email.'
                };
                setAuthError(messages[error.code] || error.message || 'Ошибка авторизации.');
            } finally {
                authBtn.disabled = false;
            }
        });

        switchAuth.addEventListener('click', () => {
            isSignUp = !isSignUp;
            authTitle.textContent = isSignUp ? 'Регистрация в C Messenger' : 'Вход в C Messenger';
            authBtn.textContent = isSignUp ? 'Зарегистрироваться' : 'Войти';
            nicknameGroup.classList.toggle('hidden', !isSignUp);
            setAuthError('');
        });

        passwordInput.addEventListener('keydown', e => {
            if (e.key === 'Enter') authBtn.click();
        });
        emailInput.addEventListener('keydown', e => {
            if (e.key === 'Enter') passwordInput.focus();
        });

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        messageInput.addEventListener('input', () => setTyping(true));

        fileBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', () => {
            const file = fileInput.files?.[0];
            if (!file) return;
            if (!file.type.startsWith('image/')) {
                showToast('Можно выбрать только изображение.');
                fileInput.value = '';
                return;
            }
            setPendingImage(file);
        });
        removeAttachment.addEventListener('click', clearAttachment);

        micBtn.addEventListener('click', async () => {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                micBtn.classList.remove('recording');
                return;
            }
            if (!navigator.mediaDevices?.getUserMedia || typeof MediaRecorder === 'undefined') {
                showToast('Запись голоса не поддерживается этим браузером.');
                return;
            }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioChunks = [];
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = e => { if (e.data.size) audioChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    stream.getTracks().forEach(t => t.stop());
                    const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
                    setPendingAudio(blob);
                    micBtn.classList.remove('recording');
                };
                mediaRecorder.start();
                micBtn.classList.add('recording');
            } catch (e) {
                console.error(e);
                showToast('Не удалось получить доступ к микрофону: ' + e.message);
            }
        });

        document.getElementById('new-chat-btn').addEventListener('click', loadUsersForNewChat);
        document.getElementById('settings-btn').addEventListener('click', () => {
            if (!currentUser) return;
            document.getElementById('settings-name-input').value = normalizeName(currentUser);
            document.getElementById('settings-email').textContent = currentUser.email || '';
            const theme = localStorage.getItem('theme-pref') || 'dark';
            document.getElementById('theme-toggle').checked = theme === 'dark';
            showScreen(settingsScreen);
        });
        document.getElementById('back-from-settings').addEventListener('click', () => showScreen(chatsScreen));
        document.getElementById('back-to-chats').addEventListener('click', () => {
            if (messagesUnsub) messagesUnsub();
            if (typingUnsub) typingUnsub();
            currentChatId = null;
            currentChatOtherUid = null;
            showScreen(chatsScreen);
        });

        document.getElementById('settings-name-save').addEventListener('click', async () => {
            if (!currentUser) return;
            const name = document.getElementById('settings-name-input').value.trim();
            if (!name) {
                showToast('Имя не может быть пустым.');
                return;
            }
            try {
                await updateProfile(currentUser, { displayName: name });
                await setDoc(doc(db, 'users', currentUser.uid), { displayName: name }, { merge: true });
                showToast('Имя сохранено', false);
            } catch (e) {
                showToast('Не удалось сохранить имя: ' + e.message);
            }
        });

        document.getElementById('theme-toggle').addEventListener('change', e => {
            const theme = e.target.checked ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme-pref', theme);
        });

        document.getElementById('notif-toggle').addEventListener('change', e => {
            localStorage.setItem('notif-pref', e.target.checked ? '1' : '0');
        });

        document.getElementById('settings-logout-btn').addEventListener('click', async () => {
            try {
                if (currentUser) {
                    const statusRef = rtdbRef(rtdb, `presence/${currentUser.uid}`);
                    await rtdbSet(statusRef, { state: 'offline', lastChanged: rtdbServerTimestamp() });
                }
            } catch (e) {}
            try { await signOut(auth); } catch (e) { showToast('Ошибка выхода: ' + e.message); }
        });

        imageViewer.addEventListener('click', () => imageViewer.classList.add('hidden'));
        messagesList.addEventListener('click', e => {
            const img = e.target.closest('.message-image');
            if (!img) return;
            imageViewerImg.src = img.src;
            imageViewer.classList.remove('hidden');
        });

        onAuthStateChanged(auth, async user => {
            currentUser = user;
            if (user) {
                showScreen(chatsScreen);
                subscribeChats();
                setupPresence();
                try {
                    const userRef = doc(db, 'users', user.uid);
                    const snap = await getDoc(userRef);
                    if (!snap.exists()) {
                        await setDoc(userRef, {
                            displayName: normalizeName(user),
                            email: user.email || '',
                            createdAt: serverTimestamp()
                        });
                    }
                } catch (e) {
                    console.warn('Не удалось сохранить профиль:', e);
                }
            } else {
                if (chatsUnsub) chatsUnsub();
                if (messagesUnsub) messagesUnsub();
                if (typingUnsub) typingUnsub();
                if (presenceUnsub) presenceUnsub();
                currentChatId = null;
                currentChatOtherUid = null;
                showScreen(authScreen);
            }
        });
    </script>
</body>
</html>
